[package]
name = "mailbox"
version = "1.0.0"
edition = "2021"

[dependencies]
mailbox-model = { path = "target/generated-sources/model" }
servicemanager = { path = "target/generated-sources/model/chassis/servicemanager" }
logger = { path = "target/generated-sources/model/chassis/logger" }
tokio = { version = "1", features = ["full"] }
tonic = { version = "0.14", features = ["transport"] }
tracing = "0.1"
async-trait = "0.1"

# Gmail (src/gmail.rs). reqwest as oauth names it: rustls with the Mozilla roots
# compiled in, because the runtime image ships no /etc/ssl/certs. ring signs the
# RS256 JWT-bearer assertion, which the chassis key cannot (it has no RS256): the
# ring rustls already builds, not the `rsa` crate, whose private-key operations
# are not constant time (RUSTSEC-2023-0071, #5). pki-types reads the key's PEM.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "rustls-tls-webpki-roots", "json"] }
ring = "0.17"
rustls-pki-types = { version = "1", features = ["std"] }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Tests only, and the same three crates messaging's tests use, for the same
# reason: the tests drive the GENERATED ValidationWrapper rather than the handler
# trait, because the (spec.principal)/(spec.namespace) stamps and the
# (spec.store_principal)/(spec.store_namespace) egress backstops are rendered in
# that wrapper and in nothing else. Driving it means minting a bearer it can
# parse (`key`, `token`) and absorbing the accounting it stamps (`am`). All three
# are the same path dependencies mailbox-model itself uses, so they are the same
# crates, not second copies.
[dev-dependencies]
# Paused time, for the read-after-write tests. `#[tokio::test(start_paused)]` is
# gated behind tokio's `test-util` feature, and the visibility bound
# (VISIBILITY_TIMEOUT) is seconds long — waiting it out for real would put a
# multi-second sleep in the suite for every test that asserts the bound.
tokio = { version = "1", features = ["full", "test-util"] }

# The RecordMeta the generated subscriber hands the handler carries a
# well-known-type Timestamp, so a test that stands in for the subscriber has to
# construct one. Same version the generated model crate pins, so it is the same
# crate rather than a second copy of the type.
prost-wkt-types = "0.7.1"
token = { path = "target/generated-sources/model/chassis/token" }
key = { path = "target/generated-sources/model/chassis/key" }
am = { path = "target/generated-sources/model/chassis/am" }
# Decodes the form the gmail tests' fake Google token endpoint receives.
serde_urlencoded = "0.7"
