kind: service
# compiler floor: the looper runs the latest 2.4.x image (tacplus#161).
tacplus: "2.4"
language: rust
# Rust takes only pkg's last segment: the crate stays mailbox-model.
pkg: com.github.tacplusdev.mailbox
output-dir: target/generated-sources
src: proto
# records here declare residency; the record query plane that reads them is the
# query trait hosted by stratum, so stratum's contract is part of this build.
depends:
  # topics declared here publish through the eventbus broker.
  - eventbus
  - stratum
  # mailbox.Config subscribes to messaging.MessageBus.stream.
  - messaging
